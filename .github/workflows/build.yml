name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build toolchain image
        run: make image

      - name: Configure and build
        run: make configure build

      - uses: actions/upload-artifact@v7
        with:
          name: vmflow-nuttx-esp32s3
          path: |
            nuttx/nuttx.bin
            nuttx/nuttx
